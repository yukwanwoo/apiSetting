name: Windows x64 executable
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:windows
      - run: npm run smoke:exe
      - name: Package portable download
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "dist/MesoLiveRoulette-$version-win-x64" -DestinationPath "dist/MesoLiveRoulette-$version-win-x64.zip"
          $zip = "MesoLiveRoulette-$version-win-x64.zip"
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          Get-Content docs/RELEASE.md -Raw | Set-Content dist/release-notes.md
          Add-Content -Path dist/release-notes.md -Value "`nZIP SHA-256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag/package version mismatch" }
          gh release create $env:GITHUB_REF_NAME "dist/MesoLiveRoulette-$version-win-x64.zip" --verify-tag --title "$version — Windows 11 x64" --notes-file dist/release-notes.md
